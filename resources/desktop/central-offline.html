<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
    <title>WaslaPOS — لا يوجد اتصال</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fc; color: #142443; font-family: 'Segoe UI', Tahoma, sans-serif; }
        main { width: min(480px, calc(100vw - 32px)); padding: 40px 24px; text-align: center; }
        h1 { margin: 0 0 12px; font-size: 24px; color: #92400e; }
        p { line-height: 1.9; }
        .spinner { display: inline-block; width: 26px; height: 26px; margin-top: 12px; border: 3px solid #f4dfb8; border-top-color: #d97706; border-radius: 50%; animation: spin 1.2s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <main role="status" aria-live="polite">
        <h1>انقطع الاتصال بالسيرفر</h1>
        <p>نقطة البيع تعمل الآن دون اتصال في النافذة الرئيسية، وتُحفظ الفواتير على الجهاز وتُزامَن تلقائيًا.</p>
        <p>ستُفتح هذه الصفحة من جديد تلقائيًا عند عودة الإنترنت.</p>
        <span class="spinner" aria-hidden="true"></span>
    </main>
</body>
</html>
