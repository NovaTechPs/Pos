<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" fill="none">
  <title>NOVO — Retail Management</title>
  <defs>
    <linearGradient id="novoMark" x1="38" y1="30" x2="205" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2859D9"/>
      <stop offset="1" stop-color="#17347D"/>
    </linearGradient>
    <linearGradient id="novoAccent" x1="76" y1="61" x2="171" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43DFC0"/>
      <stop offset="1" stop-color="#18A98C"/>
    </linearGradient>
  </defs>

  <!-- Geometric N: connected counters represent connected stores and stock flow. -->
  <rect x="22" y="22" width="206" height="206" rx="58" fill="url(#novoMark)"/>
  <path d="M69 174V78C69 70.3 78.1 66.9 82.9 72.9L164 174V78" stroke="white" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M164 174V147" stroke="url(#novoAccent)" stroke-width="21" stroke-linecap="round"/>
  <circle cx="164" cy="78" r="15" fill="url(#novoAccent)"/>

  <text x="277" y="139" fill="#14294D" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" letter-spacing="5">NOVO</text>
  <path d="M284 169H795" stroke="#E3E9F2" stroke-width="2"/>
  <text x="286" y="205" fill="#65748B" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="3.4">RETAIL MANAGEMENT</text>
  <circle cx="796" cy="197" r="7" fill="#21B99A"/>
</svg>
